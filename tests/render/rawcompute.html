<!doctype html><script type="module">
// Raw WebGPU compute (no three.js) — isolates adapter compute support from engine code (ISSUE GPU-003).
const n = +(new URLSearchParams(location.search).get('n') ?? 94523);
const a = await navigator.gpu.requestAdapter(); const d = await a.requestDevice();
d.lost.then(i => { window.lost = i.message; window.done = 1; });
const buf = d.createBuffer({ size: n * 16, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
const rb = d.createBuffer({ size: 32, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
const m = d.createShaderModule({ code: `@group(0) @binding(0) var<storage, read_write> p: array<vec4<f32>>;
@compute @workgroup_size(64) fn main(@builtin(global_invocation_id) g: vec3<u32>) { if (g.x >= arrayLength(&p)) { return; } p[g.x] = vec4<f32>(f32(g.x), 1.0, 2.0, 3.0); }` });
const pl = d.createComputePipeline({ layout: 'auto', compute: { module: m, entryPoint: 'main' } });
const bg = d.createBindGroup({ layout: pl.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: buf } }] });
const e = d.createCommandEncoder(); const pass = e.beginComputePass(); pass.setPipeline(pl); pass.setBindGroup(0, bg); pass.dispatchWorkgroups(Math.ceil(n / 64)); pass.end();
e.copyBufferToBuffer(buf, 16, rb, 0, 32); d.queue.submit([e.finish()]);
await rb.mapAsync(GPUMapMode.READ); window.result = Array.from(new Float32Array(rb.getMappedRange())); window.done = 1;
</script>
